<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Dossiê Interativo - Povos Indígenas</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial, sans-serif;
}

body{
background:#0b0b0b;
color:white;
overflow-x:hidden;
}

.hero{
height:100vh;
background:url("https://images.unsplash.com/photo-1511497584788-876760111969") center/cover;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
text-align:center;
padding:20px;
}

.hero h1{
font-size:4rem;
margin-bottom:20px;
}

.hero p{
font-size:1.3rem;
max-width:700px;
}

.botao{
margin-top:30px;
padding:15px 30px;
background:#1e7a34;
color:white;
text-decoration:none;
border-radius:10px;
font-size:1.1rem;
}

.menu-btn{
position:fixed;
top:20px;
left:20px;
font-size:35px;
cursor:pointer;
z-index:1001;
}

.sidebar{
position:fixed;
left:-260px;
top:0;
width:250px;
height:100%;
background:#111;
padding-top:70px;
transition:0.4s;
z-index:1000;
}

.sidebar a{
display:block;
padding:18px;
color:white;
text-decoration:none;
border-bottom:1px solid #222;
}

.sidebar a:hover{
background:#1e7a34;
}

.sidebar.active{
left:0;
}

section{
padding:100px 10%;
}

section h2{
font-size:2.5rem;
margin-bottom:20px;
color:#3dd16a;
}

section p{
line-height:1.8;
font-size:1.1rem;
}

.galeria{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:20px;
margin-top:40px;
}

.galeria img{
width:100%;
height:250px;
object-fit:cover;
border-radius:12px;
}

footer{
padding:50px;
text-align:center;
background:#111;
}

</style>
</head>

<body
